name: Free official news POC checks
on:
  push:
    branches: [ship-official-news-poc, fix-sebi-feed-dates, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  official-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate official RSS and failure handling
        run: node --test tests/official-poc.test.mjs
      - name: Validate browser script syntax
        run: node --check official-poc.js
      - name: Validate serverless endpoint syntax
        run: node --check netlify/functions/official-feed.mjs
